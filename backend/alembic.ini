# Alembic configuration for the AETHER X database.
# Run from backend/:  ../backend/.venv/bin/alembic upgrade head   (see README)
#
# There is deliberately no sqlalchemy.url here: migrations/env.py builds the
# connection from the AETHER_DB_* environment variables (password from
# AETHER_DB_PASSWORD or ~/.pgpass), so no credentials live in this file.

[alembic]
script_location = %(here)s/migrations
prepend_sys_path = .
# Revision files sort by creation date.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s
truncate_slug_length = 40
path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
